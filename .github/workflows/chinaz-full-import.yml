name: Import full ChinaZ website ranking

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/chinaz-full-import.yml'

permissions:
  contents: write

concurrency:
  group: domain-audit-main
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v7
        with:
          python-version: '3.15'
      - name: Traverse full ranking and validate append-only import
        run: python -u scripts/import_chinaz_rankings.py --write
      - name: Validate configuration and commit only the profile
        run: |
          python scripts/check_conf_format.py shadowrocket.conf
          git diff --check -- shadowrocket.conf
          if ! git diff --quiet -- shadowrocket.conf; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add shadowrocket.conf
            git commit -m "feat: import full ChinaZ ranking domains as DIRECT"
            git push origin HEAD:main
          else
            echo "No new DIRECT rules."
          fi
